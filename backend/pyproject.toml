[project]
name = "mysecondbrain-backend"
version = "0.1.0"
description = "FastAPI backend for MySecondBrain — personal knowledge graph + 3D sphere visualization"
requires-python = ">=3.11,<3.12"
# Direct dependencies (transitive deps live in uv.lock, not here).
# Versions match backend/requirements.txt so the uv-resolved tree is
# identical to what `pip install -r requirements.txt` produced.
dependencies = [
    "fastapi==0.135.3",
    "uvicorn[standard]==0.43.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.6.1",
    "SQLAlchemy==2.0.51",
    "psycopg2-binary==2.9.12",
    "pgvector==0.5.0",
    "alembic==1.19.0",
    "python-multipart==0.0.20",
    "numpy==1.26.4",
    "scikit-learn==1.5.2",
    "httpx==0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Dev / build-only deps go in a separate group so production images
# can install with `uv sync --no-dev` and skip them.
[dependency-groups]
dev = [
    "sentence-transformers>=3.0",  # optional; only needed when HF_HUB_OFFLINE=0
]

[tool.uv]
# Keep the lockfile in the repo so Docker builds are reproducible
# without re-resolving. Same model as frontend's package-lock.json.
managed = true

# `uv sync` will refuse to run if lockfile is out of date; that's the
# right default for a project, but we want CI/Docker to fail loudly
# rather than silently re-resolving. `uv lock` (no args) refreshes.
